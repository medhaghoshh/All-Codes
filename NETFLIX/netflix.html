<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            background-image: url('k.png.jpeg');
            background-size: cover;
            background-position: center;
        }

        header {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            width: 100px;
        }

        header nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        header nav ul li {
            display: inline;
        }

        header nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .sign-in-out {
            display: flex;
            gap: 10px;
        }

        .sign-in-out button {
            background-color: #e50914;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
        }

        .modal-header, .modal-body, .modal-footer {
            padding: 10px;
        }

        .modal-header {
            border-bottom: 1px solid #ddd;
            font-size: 18px;
        }

        .modal-footer {
            border-top: 1px solid #ddd;
            text-align: right;
        }

        .modal-footer button {
            background-color: #e50914;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Search Bar Styles */
        .search-bar {
            padding: 20px;
            background-color: rgba(34, 34, 34, 0.9);
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }

        .search-bar button {
            background-color: #e50914;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
        }

        .browse-by-language {
            padding: 20px;
            background-color: rgba(34, 34, 34, 0.9);
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .browse-by-language h2 {
            margin-top: 0;
        }

        .content-section {
            padding: 20px;
        }

        .movie-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            margin-bottom: 20px;
        }

        .movie-row img {
            width: 200px;
            border-radius: 5px;
            transition: transform 0.2s ease-in-out;
        }

        .movie-row img:hover {
            transform: scale(1.1);
        }

        .movie-row::-webkit-scrollbar {
            height: 8px;
        }

        .movie-row::-webkit-scrollbar-thumb {
            background-color: #e50914;
            border-radius: 10px;
        }

        footer {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .slider-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .slider-button {
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

    <!-- Sign In Modal -->
    <div id="signInModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sign In</h2>
                <span class="close" onclick="closeModal('signInModal')">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="Email" id="signInEmail">
                <input type="password" placeholder="Password" id="signInPassword">
            </div>
            <div class="modal-footer">
                <button onclick="signIn()">Sign In</button>
            </div>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sign Up</h2>
                <span class="close" onclick="closeModal('signUpModal')">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="Email" id="signUpEmail">
                <input type="password" placeholder="Password" id="signUpPassword">
            </div>
            <div class="modal-footer">
                <button onclick="signUp()">Sign Up</button>
            </div>
        </div>
    </div>

    <script>
        function showModal(modalId) {
            document.getElementById(modalId).style.display = "block";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function scrollLeft(sectionId) {
            const section = document.getElementById(sectionId);
            section.scrollBy({ left: -200, behavior: 'smooth' });
        }

        function scrollRight(sectionId) {
            const section = document.getElementById(sectionId);
            section.scrollBy({ left: 200, behavior: 'smooth' });
        }

        function signIn() {
            const email = document.getElementById("signInEmail").value;
            const password = document.getElementById("signInPassword").value;
            // Add your sign-in logic here
            alert("Signing in with email: " + email);
            closeModal('signInModal');
        }

        function signUp() {
            const email = document.getElementById("signUpEmail").value;
            const password = document.getElementById("signUpPassword").value;
            // Add your sign-up logic here
            alert("Signing up with email: " + email);
            closeModal('signUpModal');
        }

        function search() {
            const searchText = document.querySelector(".search-bar input").value;
            // Add your search logic here
            alert("Searching for: " + searchText);
        }
    </script>
